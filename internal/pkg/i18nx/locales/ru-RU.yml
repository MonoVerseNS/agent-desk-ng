tool.graph.createTicketConfirm.info: "Graph Tool. Обрабатывает подготовку параметров обращения, подтверждение пользователем, фактическое создание обращения и возврат результата. Используйте только тогда, когда пользователь прямо просит создать обращение и заголовок с описанием понятны."
tool.graph.createTicketConfirm.param.title: "Заголовок обращения. Кратко описывает проблему."
tool.graph.createTicketConfirm.param.description: "Описание обращения. Чётко фиксирует проблему пользователя, симптомы и запрос."
tool.graph.handoffConversation.info: "Graph Tool. Обрабатывает подготовку причины передачи, подтверждение пользователем, фактическую передачу человеку и возврат результата. Используйте только тогда, когда пользователь прямо просит оператора либо вы подтвердили, что требуется человек. Не повторяйте вызов, если результат содержит terminal=true и shouldRetry=false."
tool.graph.handoffConversation.param.reason: "Причина передачи. Кратко объясните, зачем нужен человек: прямой просьбы пользователя, ручной проверки или послепродажного обслуживания."
tool.graph.triageServiceRequest.info: "Graph Tool. Анализирует текущий диалог и определяет, нужно ли продолжить ответ, подготовить черновик обращения или передать человеку. Когда рекомендуется создание обращения, возвращает структурированную рекомендацию по черновику."
tool.graph.triageServiceRequest.param.goal: "Цель анализа, например нужно ли эскалировать, создать обращение или передать человеку."
tool.graph.triageServiceRequest.param.observedIssue: "Основная проблема или спорный вопрос, выявленный в диалоге."
tool.graph.triageServiceRequest.param.needTicket: "Нужно ли сосредоточиться на оценке создания обращения."
tool.graph.triageServiceRequest.param.needHumanHandoff: "Нужно ли сосредоточиться на оценке передачи человеку."
tool.graph.triageServiceRequest.param.additionalContext: "Дополнительный контекст, например уже выявленные признаки риска или ограничения."
tool.graph.analyzeConversation.info: "Graph Tool. Составляет сводку текущего диалога, выявляет признаки риска по жалобам, платежам и тональности и рекомендует продолжить ответ, создать обращение или передать человеку."
tool.graph.analyzeConversation.param.goal: "Цель анализа, например передать человеку, создать обращение или провести проверку рисков."
tool.graph.analyzeConversation.param.observedIssue: "Основная проблема или запрос, выявленный в диалоге."
tool.graph.analyzeConversation.param.needQualityCheck: "Нужно ли сосредоточиться на проверке рисков или качества."
tool.graph.analyzeConversation.param.additionalContext: "Дополнительный контекст, например уже выявленные спорные моменты, суть жалобы или бизнес-ограничения."
tool.graph.prepareTicketDraft.info: "Graph Tool. Готовит черновик обращения на основе текущего диалога и собранных сведений. Используйте перед create_ticket_with_confirmation, когда содержимое обращения нужно структурировать."
