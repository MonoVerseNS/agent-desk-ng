tool.builtin.toolSearch.title: "Поиск и запуск динамических инструментов"
tool.builtin.toolSearch.description: "Ищет доступные агенту инструменты MCP и запускает выбранный инструмент после подтверждения его toolCode. Подходит для редких инструментов; не должен заменять фиксированные встроенные инструменты рабочего процесса."
tool.builtin.toolSearch.appendix: |-
  Когда нужны редкие возможности MCP, отдавайте предпочтение инструменту tool_search и соблюдайте эти правила:
  1. Сначала вызовите tool_search, чтобы найти нужный динамический инструмент, затем продолжите работу с выбранным реальным инструментом.
  2. Не предполагайте, что в начале доступны все редкие инструменты: последующим вызовам модели передаются только инструменты, выбранные через tool_search.
  3. Если задачу уже решает фиксированный встроенный инструмент, отдавайте предпочтение ему и не злоупотребляйте tool_search.
tool.builtin.skill.title: "Загрузка инструкций навыка"
tool.builtin.skill.description: "Загружает специализированные инструкции навыка для текущего агента, когда нужны дополнительные указания по конкретной задаче."
tool.graph.triageServiceRequest.title: "Маршрутизация обращения"
tool.graph.triageServiceRequest.description: "Анализирует текущий диалог и определяет, нужно ли продолжить ответ, подготовить черновик обращения или передать человеку, включая черновик обращения, когда создание обращения целесообразно."
tool.graph.triageServiceRequest.appendix: |-
  Когда нужно выбрать между продолжением ответа, созданием обращения и передачей человеку, сначала вызовите triage_service_request и соблюдайте эти правила:
  1. Инструмент возвращает recommendedAction и включает ticketDraft, если требуется создание обращения.
  2. Если recommendedAction=continue_answering, продолжайте уточнять или отвечать, а не переходить сразу к эскалации.
  3. Если recommendedAction=prepare_ticket, используйте ticketDraft или соберите недостающие поля перед вызовом create_ticket_with_confirmation.
  4. Если recommendedAction=handoff_to_human, убедитесь, что причина достаточно обоснована, перед вызовом handoff_to_human.
  5. Когда путь эскалации неясен, используйте этот инструмент вместо сложного маршрутного решения только по основному промпту.
tool.graph.analyzeConversation.title: "Анализ рисков и сводки диалога"
tool.graph.analyzeConversation.description: "Составляет сводку текущего диалога, выявляет признаки риска и рекомендует продолжить ответ, создать обращение или передать человеку."
tool.graph.analyzeConversation.appendix: |-
  Когда диалог может быть связан с эскалацией, возвратом, компенсацией, явным негативным оттенком, созданием обращения или передачей человеку, сначала вызовите analyze_conversation и соблюдайте эти правила:
  1. Инструмент возвращает структурированную сводку, признаки риска и рекомендацию по следующему шагу. Он не создаёт обращения и не передаёт диалог человеку.
  2. Если инструмент рекомендует handoff_to_human, подтвердите условия передачи перед вызовом handoff_to_human.
  3. Если инструмент рекомендует prepare_ticket, вызовите prepare_ticket_draft или соберите больше информации перед созданием обращения.
  4. Если инструмент рекомендует continue_answering, продолжайте уточнять и отвечать, а не эскалировать преждевременно.
tool.graph.prepareTicketDraft.title: "Подготовка черновика обращения"
tool.graph.prepareTicketDraft.description: "Преобразует текущий диалог и собранные сведения в черновик обращения с предлагаемыми заголовком, описанием, недостающими полями и уточняющими вопросами."
tool.graph.prepareTicketDraft.appendix: |-
  Когда пользователь просит создать обращение, подать жалобу, сообщить о проблеме или запросить послепродажное обслуживание, но заголовок или описание всё ещё неясны, сначала вызовите prepare_ticket_draft и соблюдайте эти правила:
  1. Инструмент готовит черновик обращения и возвращает предлагаемые заголовок, описание, недостающие поля и уточняющие вопросы.
  2. Если ready=false, задавайте уточняющие вопросы на основе missingFields и followUpQuestions, а не создавайте обращение сразу.
  3. Если ready=true, используйте результат, чтобы решить, стоит ли вызвать create_ticket_with_confirmation.
  4. Этот инструмент только готовит черновик. Он не создаёт обращение.
tool.graph.createTicketConfirm.title: "Создание обращения с подтверждением"
tool.graph.createTicketConfirm.description: "Проводит создание обращения: подготовка параметров, подтверждение клиентом, фактическое создание и передача результата."
tool.graph.createTicketConfirm.appendix: |-
  Вы можете вызвать create_ticket_with_confirmation, когда собрано достаточно информации, но соблюдайте эти правила:
  1. Рассматривайте этот инструмент только тогда, когда пользователь прямо просит отправить обращение, подать жалобу, сообщить о проблеме или запросить послепродажное обслуживание.
  2. Перед вызовом подготовьте понятный заголовок обращения и описание проблемы. Если сведения всё ещё разрознены, сначала вызовите prepare_ticket_draft или задайте уточняющие вопросы.
  3. Когда вы готовы создать обращение, вы обязаны вызвать create_ticket_with_confirmation. Не ограничивайтесь текстовым заявлением, что обращение создано.
  4. Этот Graph Tool сначала запрашивает подтверждение пользователя. Обращение создаётся только после подтверждения; если пользователь отменяет, сценарий завершается.
  5. Если пользователь лишь задаёт вопросы, жалуется в общем виде или выражает недовольство, не прося явно об обращении, продолжайте уточнять, а не создавайте обращение проактивно.
tool.graph.handoffConversation.title: "Передача человеку с подтверждением"
tool.graph.handoffConversation.description: "Проводит передачу человеку: подготовка причины, подтверждение клиентом, фактическая передача и передача результата."
tool.graph.handoffConversation.appendix: |-
  Вы можете вызвать handoff_to_human после подтверждения, что нужна помощь человека, но соблюдайте эти правила:
  1. Вызывайте этот инструмент только тогда, когда пользователь прямо просит оператора или вы определили, что вопрос должен решаться человеком.
  2. Перед вызовом чётко сформулируйте причину передачи. Если причина неясна, сначала задайте уточняющий вопрос.
  3. Когда вы решили передать диалог, вы обязаны вызвать handoff_to_human. Не ограничивайтесь текстовым заявлением, что соединили пользователя с человеком.
  4. Этот Graph Tool сначала запрашивает подтверждение пользователя. Передача выполняется только после подтверждения; если пользователь отменяет, сценарий завершается.
  5. Если вопрос ещё можно решить в текущем диалоге, продолжайте помогать, а не эскалировать преждевременно.
  6. Если инструмент вернул terminal=true и shouldRetry=false, сценарий передачи завершён. Не вызывайте его повторно.
